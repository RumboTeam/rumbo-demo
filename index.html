<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rumbo · demo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <style>
    /* Canvas a pantalla completa: la plantilla por defecto trae un canvas de
       tamaño fijo, que en un teléfono deja el juego en una ventanita y arruina
       cualquier juicio de composición portrait. */
    :root {
      /* Proporción del lienzo: 9:16 aquí; la demo en horizontal la cambia a 16:9 (RumboBuild.AjustarPaginaDemo). */
      --prop-ancho: 16; --prop-alto: 9;
      /* Lo que de verdad se ve (2026-10-26). En los navegadores de teléfono `100vh` es el alto CON la barra de
         direcciones escondida; de lado, sin desplazamiento, esa barra no se esconde nunca, así que un lienzo de
         `100vh` quedaba más alto que la pantalla y se cortaba arriba y abajo: el marcador y «Teléfono» quedaban
         fuera y había que quitar zoom a mano. `100dvh` es el alto visible de cada momento. */
      --vis-ancho: 100vw; --vis-alto: 100vh;
    }
    @supports (height: 100dvh) { :root { --vis-ancho: 100dvw; --vis-alto: 100dvh; } }
    html, body {
      margin: 0; padding: 0; height: 100%; height: var(--vis-alto); width: 100%;
      background: #14110E; overflow: hidden;
      /* sin gestos del navegador encima del joystick */
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Letterbox a 9:16 — el juego es SOLO portrait (CanvasScaler referencia
       1080x1920). El canvas viejo ocupaba el 100% de un `<body>
<div id="girar"><div class="icono">&#x21bb;</div><div>Gira el teléfono para jugar.</div><div style="font-size:12px;color:#8A8177;">Esta versión de prueba se juega en horizontal.</div></div>` sin restricción
       de proporción: en una ventana de escritorio ancha (landscape) quedaba un
       lienzo horizontal, y toda la UI diseñada para portrait — el bloque de
       intro con texto largo, el botón Teléfono anclado abajo-derecha — se
       superponía, porque el ancho disponible ya no se parecía en nada al que
       asume el layout. No es un bug de una pantalla puntual: cualquier panel
       de texto largo choca contra cualquier elemento anclado a una esquina en
       cuanto el lienzo deja de ser angosto.
       Con el body como flex container y el canvas limitado por AMBOS ejes
       (ancho derivado del alto, alto derivado del ancho) el canvas siempre
       mantiene su proporción real, centrado, con barras del color de fondo a
       los costados en vez de estirar la interfaz fuera de su proporción.
       Los bordes seguros (muesca, esquinas redondeadas, barra de gestos) se
       descuentan con `env(safe-area-inset-*)`: con `viewport-fit=cover` la
       página llega bajo ellos y un botón pegado a una esquina quedaría tapado. */
    body {
      display: flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    #unity-canvas {
      display: block; background: #14110E;
      touch-action: none;
      --libre-ancho: calc(var(--vis-ancho) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      --libre-alto: calc(var(--vis-alto) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      width: min(var(--libre-ancho), calc(var(--libre-alto) * var(--prop-ancho) / var(--prop-alto)));
      height: min(var(--libre-alto), calc(var(--libre-ancho) * var(--prop-alto) / var(--prop-ancho)));
    }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #E8E2D8; background: #14110E; z-index: 10;
    }
    #barra { width: 58%; max-width: 320px; height: 4px; background: #2E2A25; border-radius: 2px; }
    #relleno { width: 0%; height: 100%; background: #C2502E; border-radius: 2px; transition: width .15s; }
    #nota { font-size: 12px; color: #8A8177; text-align: center; padding: 0 24px; line-height: 1.5; }
    #girar { display: none; position: fixed; inset: 0; z-index: 20; background: #14110E; color: #E8E2D8;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 0 32px; }
    #girar .icono { font-size: 44px; }
    @media (orientation: portrait) { #girar { display: flex; } }
  </style>
</head>
<body>
<div id="girar"><div class="icono">&#x21bb;</div><div>Gira el teléfono para jugar.</div><div style="font-size:12px;color:#8A8177;">Esta versión de prueba se juega en horizontal.</div></div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="carga">
    <div style="font-size:15px; letter-spacing:.08em;">RUMBO · DEMO</div>
    <div id="barra"><div id="relleno"></div></div>
    <div id="nota">Versión de prueba: los días 1 a 24.<br>Tu partida se guarda solo en este navegador.<br>Las voces de Mario se generaron con IA.</div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var carga = document.querySelector("#carga");
    var relleno = document.querySelector("#relleno");

    // El tamaño del backbuffer lo maneja Unity vía matchWebGLToCanvasSize: si se
    // asigna canvas.width/height a mano Y se desactiva esa opción, el buffer queda
    // en 0x0 y no se dibuja nada. El CSS define el tamaño; Unity sigue al CSS.
    var script = document.createElement("script");
    script.src = "Build/BuildWeb-demo-horizontal.loader.js?v=2026-10-26_0446";
    script.onload = function () {
      createUnityInstance(canvas, {
        dataUrl: "Build/BuildWeb-demo-horizontal.data.unityweb?v=2026-10-26_0446",
        frameworkUrl: "Build/BuildWeb-demo-horizontal.framework.js.unityweb?v=2026-10-26_0446",
        codeUrl: "Build/BuildWeb-demo-horizontal.wasm.unityweb?v=2026-10-26_0446",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Rumbo",
        productName: "Rumbo demo",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      }, function (progreso) {
        relleno.style.width = (progreso * 100) + "%";
      }).then(function () {
        carga.style.display = "none";
      }).catch(function (e) {
        document.querySelector("#nota").textContent = "Error al cargar: " + e;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
